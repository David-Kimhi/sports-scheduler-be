services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - ./.env
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || wget -qO- http://localhost:3000/health >/dev/null || (nc -z localhost 3000)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    build:
      context: ../sports-scheduler-web
      dockerfile: Dockerfile
      args:
        BACKEND_BASE: "https://sport-scheduler.com/api"
        FOOTBALL_ENDPOINT: "/football"
        # SKIP_ASSET_DOWNLOAD is passed only during first deploy via CLI
    environment:
      DOMAIN: sport-scheduler.com
      VITE_API_BASE: /api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # If you ever choose runtime logos, add the bind **here**, not top-level:
      # - ../sports-scheduler-web/public/assets/logos:/usr/share/caddy/assets/logos:ro
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Host: sport-scheduler.com' http://127.0.0.1/ >/dev/null || wget -qO- --no-check-certificate --header='Host: sport-scheduler.com' https://127.0.0.1/ >/dev/null || (nc -z 127.0.0.1 80)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  web-jobs:
    image: node:20-alpine
    working_dir: /web
    volumes:
      - ../sports-scheduler-web:/web
    environment:
      BACKEND_BASE: https://sport-scheduler.com/api
      FOOTBALL_ENDPOINT: /football
      VITE_API_BASE: https://sport-scheduler.com/api
      VITE_FOOTBALL_ENDPOINT: /football

  scraper:
    image: scheduler-scraper:latest          # or 
    build: { context: ., dockerfile: Dockerfile.scraper }
    env_file:
      - ./.env
    volumes:
      - ./logs:/app/dist/logs                # same as /root/sports-scheduler-be/logs
      - ./data/flags.json:/app/dist/data/flags.json
    # don't restart a batch job forever:
    restart: "no"

volumes:
  caddy_data: {}
  caddy_config: {}
