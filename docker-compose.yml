# docker-compose.yml
services:
  api:
    build:
      context: .  
      dockerfile: Dockerfile.server 
    env_file:
      - ./.env
    expose:
      - "3000"
    restart: unless-stopped

  web:
    build:
      context: ../sports-scheduler-web
      dockerfile: Dockerfile  
    environment:
      - DOMAIN=sport-scheduler.com          # used in Caddyfile {$DOMAIN}
      - VITE_API_BASE=/api            
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data               # persist TLS certs
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
