# docker-compose.yml
services:
  api:
    build:
      context: .  
      dockerfile: Dockerfile.server 
    env_file:
      - ./.env
    expose:
      - "3000"
    restart: unless-stopped

  web:
    build:
      context: ../sports-scheduler-web
      dockerfile: Dockerfile  
      args:
        BACKEND_BASE: "https://sport-scheduler.com/api"
        FOOTBALL_ENDPOINT: "/football"
        SKIP_ASSET_DOWNLOAD: "1"
    environment:
      - DOMAIN=sport-scheduler.com          # used in Caddyfile {$DOMAIN}
      - VITE_API_BASE=/api            
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data               # persist TLS certs
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  web-jobs:
    image: node:20-alpine
    working_dir: /web
    volumes:
      - ../sports-scheduler-web:/web
    environment:
      - BACKEND_BASE=https://sport-scheduler.com/api
      - FOOTBALL_ENDPOINT=/football


volumes:
  - caddy_data: /data
  - caddy_config: /config
  - ../sports-scheduler-web/src/assets/logos:/usr/share/caddy/assets/logos:ro

